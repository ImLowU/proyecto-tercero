<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña · NextLeague</title>
    <link rel="icon" href="../logo/favicon.png">
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="acceso.css">
</head>
<body data-pagina="recuperar">
    <header id="encabezado"></header>

    <main id="contenido" class="acceso acceso--angosto">
        <div class="contenedor acceso__contenido">
            <section class="panel acceso__tarjeta" aria-labelledby="tituloRecuperar">
                <h1 id="tituloRecuperar">¿Olvidaste tu contraseña?</h1>
                <p class="acceso__subtitulo">Escribí el correo de tu cuenta y te mandamos un enlace para elegir una nueva.</p>

                <div id="alertaAcceso" class="oculto"></div>
                <div id="avisoDemo" class="oculto"></div>

                <form id="formRecuperar" class="formulario" novalidate>
                    <div class="campo">
                        <label for="correo">Correo electrónico</label>
                        <div class="campo-icono">
                            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                            <input type="email" id="correo" placeholder="correo@ejemplo.com" autocomplete="email" maxlength="150" required>
                        </div>
                        <span class="error-campo" id="correoError"></span>
                    </div>
                    <button type="submit" class="btn btn-primario">Enviar enlace</button>
                </form>

                <p class="acceso__pie"><a href="login" class="tocable">Volver a iniciar sesión</a></p>
            </section>
        </div>
    </main>

    <footer id="pie"></footer>

    <script src="../shared/api.js"></script>
    <script src="../shared/formato.js"></script>
    <script src="../shared/ui.js"></script>
    <script src="../shared/layout.js"></script>
    <script src="acceso.js"></script>
    <script src="recuperar.js"></script>
</body>
</html>
