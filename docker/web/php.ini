; =====================================================================
; PHP DENTRO DEL CONTENEDOR "web" (se suma a php.ini-production)
; =====================================================================

; La hora de Uruguay, igual que la base (-03:00, sin horario de verano)
date.timezone = America/Montevideo

; Los errores van al registro, nunca a la pantalla
display_errors = Off
log_errors = On

; No anunciar la versión de PHP en las cabeceras
expose_php = Off

; Logos, fotos y reglas en PDF (la aplicación controla el tamaño de cada uno)
upload_max_filesize = 10M
post_max_size = 12M

; Solo se aceptan identificadores de sesión creados por el servidor
session.use_strict_mode = 1
