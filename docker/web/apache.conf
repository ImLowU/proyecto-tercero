# =====================================================================
# SITIO DE NEXTLEAGUE DENTRO DEL CONTENEDOR "web"
# - La raíz del sitio es public/: app/, database/ y config.php quedan
#   fuera del alcance del navegador (en XAMPP los protegen los .htaccess).
# - El puerto 80 solo redirige a HTTPS (443).
# - Las reglas de public/.htaccess (cabeceras de seguridad y direcciones
#   sin ".html") y las de la API funcionan igual que en XAMPP.
# =====================================================================

ServerName localhost
# No mostrar la versión de Apache ni del sistema en errores y cabeceras.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    # Mismo servidor, pero por HTTPS. NL_PUERTO_HTTPS es el puerto que ve
    # el navegador (8443 en esta PC), que no es el 443 de adentro del contenedor.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^([^:]+)
    RewriteRule ^ https://%1:${NL_PUERTO_HTTPS}%{REQUEST_URI} [R=302,L]
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/nextleague/public

    # Certificado: el real de docker/ssl/ o, si no hay, uno autofirmado
    # (lo prepara docker/web/entrypoint.sh antes de arrancar Apache).
    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/certificado.crt
    SSLCertificateKeyFile /etc/apache2/ssl/clave.key

    # La raíz del sitio lleva a la portada.
    RedirectMatch 302 ^/$ /home/

    <Directory /var/www/nextleague/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Archivos que suben los usuarios: acá nunca se ejecuta PHP (además de
    # lo que ya dice public/uploads/.htaccess).
    <Directory /var/www/nextleague/public/uploads>
        php_admin_flag engine off
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
