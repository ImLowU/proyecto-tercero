services:
  app:
    build: .
    container_name: sgdm_app
    ports:
      - "8080:80"
    environment:
      BASE_URL: ""
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: sgdm
      DB_USER: springstudent
      DB_PASSWORD: springstudent
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: sgdm_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sgdm
      MYSQL_USER: springstudent
      MYSQL_PASSWORD: springstudent
      MYSQL_ROOT_PASSWORD: springstudent
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  db_data:
