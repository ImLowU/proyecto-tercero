name: sporttime

services:
  app:
    build: .
    container_name: sporttime_app
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8082}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - .:/var/www/sporttime:z
      - sporttime_apache_logs:/var/log/apache2
      # Estado del contenedor entre reinicios (marca de datos de demostracion
      # ya cargados). Se borra con `docker compose down -v`, que es lo que hace
      # que una instalacion desde cero vuelva a sembrar.
      - sporttime_estado:/var/lib/sporttime
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-sporttime}
      - DB_USER=${DB_USER:-sporttime_user}
      - DB_PASS=${DB_PASS:-change_this_db_password}
      - APP_URL=${APP_URL:-http://localhost:8082}
      - HTTPS_PORT=${HTTPS_PORT:-8443}
      # Carga database/seed_demo.php una vez por instalacion (marca en el
      # volumen sporttime_estado). 0 lo desactiva; force vuelve a sembrar.
      - SEED_DEMO=${SEED_DEMO:-1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sporttime_net

  db:
    image: mysql:8.0
    container_name: sporttime_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-change_this_root_password}
      MYSQL_DATABASE:      ${DB_NAME:-sporttime}
      MYSQL_USER:          ${DB_USER:-sporttime_user}
      MYSQL_PASSWORD:      ${DB_PASS:-change_this_db_password}
      TZ:                  America/Argentina/Buenos_Aires
    # Sin "ports": no se publica al host, solo accesible dentro de sporttime_net (por app y pma).
    volumes:
      - sporttime_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro,z
      - ./database/seed_sporttime.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro,z
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=America/Argentina/Buenos_Aires
    healthcheck:
      # Por TCP (-h 127.0.0.1) y contra una tabla del esquema, a proposito:
      #  - El servidor TEMPORAL que la imagen levanta para correr los scripts de
      #    /docker-entrypoint-initdb.d escucha solo por socket. Un ping por
      #    socket lo da por sano y 'app' arranca sobre una base sin tablas.
      #  - Consultar `roles` garantiza ademas que el esquema y el seed ya
      #    terminaron, no solo que hay un servidor escuchando.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1 FROM roles LIMIT 1' \"$$MYSQL_DATABASE\""]
      interval: 10s
      timeout: 5s
      retries: 12
      # La primera inicializacion (crear el datadir + cargar schema y seed) puede
      # pasar de cuatro minutos en una maquina con disco lento. Con menos que
      # esto, 'docker compose up -d' falla con "dependency failed to start" la
      # primerisima vez y hay que reintentar a mano.
      start_period: 360s
    networks:
      - sporttime_net

  pma:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sporttime_pma
    restart: unless-stopped
    ports:
      - "${PMA_HTTP_PORT:-8083}:80"
    environment:
      # Sin PMA_USER/PMA_PASSWORD a propósito: con esas variables, phpMyAdmin
      # usa auth_type "config" y AUTO-loguea a cualquiera que llegue al puerto,
      # sin pedir usuario/contraseña — quien acceda a este puerto tendría
      # control total de la base sin ningún desafío. Sin ellas, usa el modo
      # por defecto ("cookie"): pide login real en cada acceso.
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sporttime_net

volumes:
  sporttime_mysql_data:
    name: sporttime_mysql_data
  sporttime_apache_logs:
    name: sporttime_apache_logs
  sporttime_estado:
    name: sporttime_estado

networks:
  sporttime_net:
    name: sporttime_net
    driver: bridge
